name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Buat proyek Android
        run: flutter create --project-name anistream --platforms=android .
      - name: Pasang kode dan izin internet
        run: |
          cp app/main.dart lib/main.dart
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub add video_player
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: anistream-apk
          path: build/app/outputs/flutter-apk/app-release.apk
